<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alumnos - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Alumnos</h2>
        <div>
            <span class="me-3 fw-bold">Usuario: <span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>

    <!-- Filtros de búsqueda -->
    
    <div class="row mb-3">
        <div class="col-md-5">
            <form th:action="@{/alumnos}" method="get" class="d-flex gap-2">
                <input type="text" name="carrera" class="form-control" placeholder="Buscar por Carrera">
                <button type="submit" class="btn btn-secondary">Filtrar</button>
            </form>
        </div>
        <div class="col-md-5">
            <form th:action="@{/alumnos}" method="get" class="d-flex gap-2">
                <input type="text" name="rut" class="form-control" placeholder="Buscar por RUT">
                <button type="submit" class="btn btn-secondary">Buscar</button>
            </form>
        </div>
        <div class="col-md-2 text-end">
            <a th:href="@{/alumnos}" class="btn btn-outline-secondary w-100">Limpiar</a>
        </div>
    </div>

    <!-- Botón Nuevo Alumno exclusivo para ADMIN -->
    
    <div class="mb-3" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/alumnos/nuevo}" class="btn btn-primary">+ Registrar Nuevo Alumno</a>
    </div>

    <!-- Tabla de datos -->
    
    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>RUT</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Carrera</th>
                    <th>Jornada</th>
                    <th>Sede</th>
                    <th>Estado</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.id}">1</td>
                    <td th:text="${alumno.rut}">12345678-9</td>
                    <td th:text="${alumno.nombre}">Anita</td>
                    <td th:text="${alumno.apellido}">LaHuerfanita</td>
                    <td th:text="${alumno.email}">Anita@example.com</td>
                    <td th:text="${alumno.carrera}">Informática</td>
                    <td th:text="${alumno.jornada}">Diurna</td>
                    <td th:text="${alumno.sede}">Santiago</td>
                    <td th:text="${alumno.estado}">Activo</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/alumnos/editar/{id}(id=${alumno.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/alumnos/eliminar/{id}(id=${alumno.id})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Está seguro de eliminar este alumno?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(alumnos)}">
                    <td colspan="10" class="text-center py-4">No se encontraron alumnos registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
